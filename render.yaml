# Render Infrastructure as Code Blueprint for DPDP-Guard SaaS
# 100% Free ($0/month) Hackathon Demo Deployment:
# Single-service web container: React SPA frontend + FastAPI backend + Playwright runner
# Database: External Free PostgreSQL (e.g. Neon) via DATABASE_URL, or local SQLite fallback

services:
  - type: web
    name: dpdp-guard-saas
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://dpdp-guard-saas.onrender.com"
      - key: ALLOWED_LOCAL_DOMAINS
        value: paysecure-india.in,apollo-telemed.co.in,retail-bharat.store,localhost,127.0.0.1,demo.dpdpguard.in
      - key: MAX_SCAN_CONCURRENCY
        value: "1"
      - key: ENABLE_TESTBED
        value: "false"
      - key: COPILOT_PROVIDER
        value: demo
